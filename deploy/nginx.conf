# Example nginx site for production: serves the built frontend (web/dist) and
# forwards /api to the Spring Boot backend, so browser and API share one origin.
# Put TLS in front of this (or add `listen 443 ssl` here) before team use.
server {
    listen 80;
    server_name kb.example.internal;

    root /opt/zhixu-kb/web/dist;
    index index.html;
    client_max_body_size 11m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/spaces/1/pages/2 ...) all load the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
