server.address=${KB_HOST:0.0.0.0}
server.port=${KB_PORT:8765}

# MySQL 8+. The session time zone is forced to UTC so CURRENT_TIMESTAMP values are UTC,
# which is what the frontend expects. Local credentials go in config/application.properties
# (not committed); in production set KB_DB_URL / KB_DB_USER / KB_DB_PASSWORD.
spring.datasource.url=${KB_DB_URL:jdbc:mysql://localhost:3306/zhixu_kb?createDatabaseIfNotExist=true&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${KB_DB_USER:root}
spring.datasource.password=${KB_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${KB_DB_POOL:10}

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.sql.init.encoding=UTF-8
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.mvc.problemdetails.enabled=false
# Comma-separated origins allowed to call the API cross-origin. Leave empty when the
# frontend is served from the same origin (for example behind the bundled nginx config).
kb.cors-origins=${KB_CORS_ORIGINS:}
kb.upload-dir=${KB_UPLOAD_DIR:data/uploads}
